  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

adius:50%;pointer-events:none;opacity:.4;background:radial-gradient(50% 50% at 50% 50%, #E0B6A6 0%, #C98A6F 52%, rgba(201,138,111,0) 76%)\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1;text-align:center;max-width:920px;margin:0 auto;padding:clamp(64px,9vw,104px) clamp(22px,4vw,40px) clamp(64px,8vw,96px)\">\n    <h1 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.04;letter-spacing:-0.02em;margin:0 0 26px;text-wrap:pretty\">Buy back your time.<\u002Fh1>\n    <p style=\"font-size:clamp(1.05rem,1.6vw,1.3rem);line-height:1.6;color:rgba(27,22,16,0.66);margin:0 auto 36px;max-width:680px;text-wrap:pretty\">Lantern Collabs takes the repetitive work off your plate two ways — AI agents that never clock off, and dedicated assistants who work as part of your team. AI where it can, people where it can't.<\u002Fp>\n    <div style=\"display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap\">\n      <a href=\"#book-a-call\" style=\"background:#A8684F;color:#F7F2EC;font-size:16px;font-weight:500;border-radius:8px;padding:15px 28px;line-height:1;display:inline-flex;align-items:center;transition:background .22s\" style-hover=\"background:#8E5642;color:#F7F2EC\">Book a call<\u002Fa>\n      <a href=\"#two-ways\" style=\"background:transparent;color:#1B1610;font-size:16px;font-weight:500;border-radius:8px;padding:15px 28px;line-height:1;display:inline-flex;align-items:center;border:1px solid rgba(27,22,16,0.22);transition:border-color .22s\" style-hover=\"border-color:#1B1610;color:#1B1610\">See the two ways<\u002Fa>\n    <\u002Fdiv>\n    <p style=\"font-size:14px;color:rgba(27,22,16,0.44);margin:30px 0 0;display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center\">\n      <span>Built in Australia<\u002Fspan><span aria-hidden=\"true\" style=\"color:rgba(27,22,16,0.22)\">·<\u002Fspan>\n      <span>Works with the tools you already use<\u002Fspan><span aria-hidden=\"true\" style=\"color:rgba(27,22,16,0.22)\">·<\u002Fspan>\n      <span>Set up for you<\u002Fspan>\n    <\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(64px,9vw,96px) 0\">\n  <div style=\"max-width:720px;margin:0 auto;padding:0 clamp(22px,4vw,40px);text-align:center\">\n    <p style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(1.6rem,3.2vw,2.3rem);line-height:1.18;letter-spacing:-0.01em;margin:0 0 28px;text-wrap:pretty\">You didn't start your business to answer phones.<\u002Fp>\n    <p style=\"font-size:1.1875rem;line-height:1.7;color:rgba(27,22,16,0.66);margin:0 0 24px;text-wrap:pretty\">But the phone never stops — enquiries, bookings, reschedules, invoice chasing, follow-ups. And behind it sits everything else: inboxes, data entry, reports, the admin nobody planned for. Keep up with all of it and either you're doing it yourself at 9pm, or your team's stuck on it instead of the work that actually matters.<\u002Fp>\n    <p style=\"font-size:1.1875rem;line-height:1.7;color:#1B1610;margin:0;font-weight:500;text-wrap:pretty\">Growing only makes it heavier — more enquiries, more admin, more hours nobody has.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"two-ways\" style=\"background:#F1E8DD;padding:clamp(64px,9vw,96px) 0\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:0 clamp(22px,4vw,40px)\">\n    <h2 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(2rem,3.4vw,2.75rem);margin:0 0 18px;line-height:1.1;letter-spacing:-0.01em\">Two ways to get your time back<\u002Fh2>\n    <p style=\"font-size:1.1875rem;line-height:1.65;color:rgba(27,22,16,0.66);margin:0 0 48px;max-width:660px;text-wrap:pretty\">Some work is repetitive and endless — that's for an AI agent. Some work needs judgement, context and a human voice — that's for a dedicated assistant. Most businesses end up with both.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:24px\">\n\n      <div style=\"background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:12px;padding:clamp(28px,4vw,40px);display:flex;flex-direction:column\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(27,22,16,0.44)\">Always on<\u002Fspan>\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.9rem;line-height:1.15;margin:14px 0 14px\">AI agents<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0 0 26px\">An always-on AI teammate that answers your calls, books your jobs and handles the repetitive admin — 24/7, nights and weekends included.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:0;margin-bottom:30px\">\n          <div style=\"padding:14px 0;border-bottom:1px solid rgba(27,22,16,0.12);font-size:1.0625rem;line-height:1.5\">Answers every call and enquiry<\u002Fdiv>\n          <div style=\"padding:14px 0;border-bottom:1px solid rgba(27,22,16,0.12);font-size:1.0625rem;line-height:1.5\">Books jobs straight into your system<\u002Fdiv>\n          <div style=\"padding:14px 0;border-bottom:1px solid rgba(27,22,16,0.12);font-size:1.0625rem;line-height:1.5\">Chases unpaid invoices and follow-ups<\u002Fdiv>\n          <div style=\"padding:14px 0;font-size:1.0625rem;line-height:1.5\">Handles the repetitive admin, at any volume<\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"AI%20Agents.dc.html\" style=\"margin-top:auto;font-size:16px;font-weight:500;color:#A8684F;display:inline-flex;align-items:center;gap:8px\" style-hover=\"color:#8E5642\">Explore AI agents <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n\n      <div style=\"background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:12px;padding:clamp(28px,4vw,40px);display:flex;flex-direction:column\">\n        <span style=\"font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(27,22,16,0.44)\">Part of your team<\u002Fspan>\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.9rem;line-height:1.15;margin:14px 0 14px\">Dedicated assistants<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0 0 26px\">A skilled assistant working to your business, part-time or full-time — recruited, trained and managed by us, so you get the output without the hiring.<\u002Fp>\n        <div style=\"display:flex;flex-direction:column;gap:0;margin-bottom:30px\">\n          <div style=\"padding:14px 0;border-bottom:1px solid rgba(27,22,16,0.12);font-size:1.0625rem;line-height:1.5\">The same person, every week<\u002Fdiv>\n          <div style=\"padding:14px 0;border-bottom:1px solid rgba(27,22,16,0.12);font-size:1.0625rem;line-height:1.5\">Inbox, scheduling, client admin, data<\u002Fdiv>\n          <div style=\"padding:14px 0;border-bottom:1px solid rgba(27,22,16,0.12);font-size:1.0625rem;line-height:1.5\">Premium skills: bookkeeping, marketing, CRM<\u002Fdiv>\n          <div style=\"padding:14px 0;font-size:1.0625rem;line-height:1.5\">We manage performance and reporting<\u002Fdiv>\n        <\u002Fdiv>\n        <a href=\"Dedicated%20Assistants.dc.html\" style=\"margin-top:auto;font-size:16px;font-weight:500;color:#A8684F;display:inline-flex;align-items:center;gap:8px\" style-hover=\"color:#8E5642\">Explore dedicated assistants <span aria-hidden=\"true\">→<\u002Fspan><\u002Fa>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"how\" style=\"padding:clamp(64px,9vw,96px) 0\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:0 clamp(22px,4vw,40px)\">\n    <h2 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(2rem,3.4vw,2.75rem);margin:0 0 52px;line-height:1.1;letter-spacing:-0.01em\">How it works<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:40px\">\n      <div>\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px\">\n          <span style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:500;font-size:15px;width:38px;height:38px;border-radius:50%;border:1.5px solid #A8684F;color:#A8684F;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0\">1<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:rgba(27,22,16,0.12)\"><\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.4rem;margin:0 0 10px;line-height:1.25\">We find where your time goes.<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">A quick look at the calls, the admin and the bottlenecks — and which of them needs a person.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px\">\n          <span style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:500;font-size:15px;width:38px;height:38px;border-radius:50%;border:1.5px solid #A8684F;color:#A8684F;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0\">2<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:rgba(27,22,16,0.12)\"><\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.4rem;margin:0 0 10px;line-height:1.25\">We build the right mix.<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">An AI agent, a dedicated assistant, or both — connected to the tools you already use. We set it all up.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display:flex;align-items:center;gap:14px;margin-bottom:20px\">\n          <span style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:500;font-size:15px;width:38px;height:38px;border-radius:50%;border:1.5px solid #A8684F;color:#A8684F;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0\">3<\u002Fspan>\n          <span style=\"flex:1;height:1px;background:rgba(27,22,16,0.12)\"><\u002Fspan>\n        <\u002Fdiv>\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.4rem;margin:0 0 10px;line-height:1.25\">It runs, and we keep it running.<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">You get your time back. We handle the monitoring, the reporting and the fixes.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:1.0625rem;color:rgba(27,22,16,0.66);margin:48px 0 0;max-width:620px\">No new systems to learn. We do the setup; you get the outcome.<\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"background:#1B1610;position:relative;overflow:hidden\">\n  <div style=\"position:absolute;width:620px;height:620px;right:-10%;bottom:-55%;border-radius:50%;pointer-events:none;opacity:.42;background:radial-gradient(50% 50% at 50% 50%, #E0B6A6 0%, #C98A6F 52%, rgba(201,138,111,0) 76%)\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1;text-align:center;max-width:760px;margin:0 auto;padding:clamp(64px,9vw,96px) clamp(22px,4vw,40px)\">\n    <h2 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(2rem,3.6vw,2.9rem);line-height:1.1;letter-spacing:-0.015em;color:#F7F2EC;margin:0 0 22px\">See it for yourself<\u002Fh2>\n    <p style=\"font-size:1.1875rem;line-height:1.65;color:rgba(247,242,236,0.66);margin:0 auto 34px;max-width:620px;text-wrap:pretty\">The best way to understand Lantern Collabs is to see it work. Book a quick call and we'll walk you through exactly how we'd handle the calls, bookings, follow-ups and admin for a business like yours — no commitment, no pressure.<\u002Fp>\n    <a href=\"#book-a-call\" style=\"background:#A8684F;color:#F7F2EC;font-size:16px;font-weight:500;border-radius:8px;padding:15px 28px;line-height:1;display:inline-flex;align-items:center;transition:background .22s\" style-hover=\"background:#8E5642;color:#F7F2EC\">Book a call<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(64px,9vw,96px) 0\">\n  <div style=\"max-width:800px;margin:0 auto;padding:0 clamp(22px,4vw,40px)\">\n    <h2 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(2rem,3.6vw,2.85rem);margin:0 0 22px;line-height:1.12;letter-spacing:-0.01em;max-width:680px;text-wrap:pretty\">If your business runs on calls and admin, Lantern Collabs is for you.<\u002Fh2>\n    <p style=\"font-size:1.1875rem;line-height:1.65;color:rgba(27,22,16,0.66);margin:0 0 36px;max-width:660px;text-wrap:pretty\">It doesn't matter what trade or industry you're in. If you take bookings or appointments, field enquiries and chase follow-ups — and growing means more of that, not less — Lantern Collabs fits.<\u002Fp>\n    <div style=\"display:flex;flex-wrap:wrap;gap:10px 12px;margin-bottom:16px\">\n      <span style=\"font-size:14.5px;color:rgba(27,22,16,0.66);background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:8px;padding:8px 14px;line-height:1\">NDIS and allied health<\u002Fspan>\n      <span style=\"font-size:14.5px;color:rgba(27,22,16,0.66);background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:8px;padding:8px 14px;line-height:1\">accounting and bookkeeping<\u002Fspan>\n      <span style=\"font-size:14.5px;color:rgba(27,22,16,0.66);background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:8px;padding:8px 14px;line-height:1\">real estate<\u002Fspan>\n      <span style=\"font-size:14.5px;color:rgba(27,22,16,0.66);background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:8px;padding:8px 14px;line-height:1\">home services and trades<\u002Fspan>\n      <span style=\"font-size:14.5px;color:rgba(27,22,16,0.66);background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:8px;padding:8px 14px;line-height:1\">clinics and wellness<\u002Fspan>\n      <span style=\"font-size:14.5px;color:rgba(27,22,16,0.66);background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:8px;padding:8px 14px;line-height:1\">professional services<\u002Fspan>\n      <span style=\"font-size:14.5px;color:rgba(27,22,16,0.66);background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:8px;padding:8px 14px;line-height:1\">coaches and consultants<\u002Fspan>\n      <span style=\"font-size:14.5px;color:rgba(27,22,16,0.66);background:#FBF8F3;border:1px solid rgba(27,22,16,0.12);border-radius:8px;padding:8px 14px;line-height:1\">e-commerce<\u002Fspan>\n    <\u002Fdiv>\n    <p style=\"font-size:1.0625rem;color:rgba(27,22,16,0.44);margin:0 0 40px\">— and plenty that don't fit a neat label.<\u002Fp>\n    <p style=\"font-size:1.125rem;line-height:1.65;color:#1B1610;margin:0 0 28px;max-width:660px\"><span style=\"font-weight:600\">The simple test:<\u002Fspan> if someone in your business spends hours on the phone and the repetitive admin around it, Lantern Collabs can take that off their plate.<\u002Fp>\n    <p style=\"font-size:1.0625rem;line-height:1.65;color:rgba(27,22,16,0.66);margin:0\">Not sure which one fits how you work? That's a 10-minute conversation. <a href=\"#book-a-call\" style=\"font-weight:500\">Book a call.<\u002Fa><\u002Fp>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"why\" style=\"background:#F1E8DD;padding:clamp(64px,9vw,96px) 0\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:0 clamp(22px,4vw,40px)\">\n    <h2 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(2rem,3.4vw,2.75rem);margin:0 0 52px;line-height:1.1;letter-spacing:-0.01em\">Why Lantern Collabs<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:36px 48px\">\n      <div style=\"padding-top:22px;border-top:1px solid rgba(27,22,16,0.12)\">\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 9px;line-height:1.25\">One partner, both answers<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">AI where it can, people where it can't — and no arguing between two vendors about which is which.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding-top:22px;border-top:1px solid rgba(27,22,16,0.12)\">\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 9px;line-height:1.25\">Works with your tools<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">It fits into the systems you already run, not the other way around.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding-top:22px;border-top:1px solid rgba(27,22,16,0.12)\">\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 9px;line-height:1.25\">You stay in control<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">Your phone number, your data, your systems — under your control, not locked in a black box.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding-top:22px;border-top:1px solid rgba(27,22,16,0.12)\">\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 9px;line-height:1.25\">Managed, not just supplied<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">Recruitment, training, performance monitoring and reporting sit with us. You manage outcomes, not people.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding-top:22px;border-top:1px solid rgba(27,22,16,0.12)\">\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 9px;line-height:1.25\">Done for you<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">We handle the setup end to end. You just start getting your time back.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"padding-top:22px;border-top:1px solid rgba(27,22,16,0.12)\">\n        <h3 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.35rem;margin:0 0 9px;line-height:1.25\">Australian<\u002Fh3>\n        <p style=\"font-size:1.0625rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0\">Australian owned and managed, built here for businesses like yours.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:clamp(64px,9vw,96px) 0\">\n  <div style=\"max-width:800px;margin:0 auto;padding:0 clamp(22px,4vw,40px)\">\n    <h2 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(2rem,3.4vw,2.75rem);margin:0 0 40px;line-height:1.1;letter-spacing:-0.01em\">Common questions<\u002Fh2>\n    <div style=\"border-top:1px solid rgba(27,22,16,0.12)\">\n      <sc-for list=\"{{ faqs }}\" as=\"q\" hint-placeholder-count=\"5\">\n        <div style=\"border-bottom:1px solid rgba(27,22,16,0.12)\">\n          <button type=\"button\" sc-camel-on-click=\"{{ q.toggle }}\" style=\"width:100%;background:transparent;border:0;padding:24px 0;display:flex;align-items:flex-start;gap:20px;cursor:pointer;text-align:left;font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:1.25rem;line-height:1.35;color:#1B1610\" style-hover=\"color:#8E5642\">\n            <span style=\"flex:1\">{{ q.question }}<\u002Fspan>\n            <span aria-hidden=\"true\" style=\"{{ q.signStyle }}\">+<\u002Fspan>\n          <\u002Fbutton>\n          <div style=\"{{ q.answerStyle }}\">\n            <p style=\"font-size:1.0625rem;line-height:1.65;color:rgba(27,22,16,0.66);margin:0;padding:0 0 24px;max-width:640px\">{{ q.answer }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"book-a-call\" style=\"background:#ECE0D2;position:relative;overflow:hidden\">\n  <div style=\"position:absolute;width:680px;height:680px;left:50%;top:-58%;transform:translateX(-50%);border-radius:50%;pointer-events:none;opacity:.5;background:radial-gradient(50% 50% at 50% 50%, #E0B6A6 0%, #C98A6F 52%, rgba(201,138,111,0) 76%)\"><\u002Fdiv>\n  <div style=\"position:relative;z-index:1;text-align:center;max-width:760px;margin:0 auto;padding:clamp(72px,10vw,112px) clamp(22px,4vw,40px)\">\n    <h2 style=\"font-family:'Crimson Pro',Georgia,serif;font-weight:600;font-size:clamp(2.2rem,4.4vw,3.4rem);line-height:1.08;letter-spacing:-0.015em;margin:0 0 20px;text-wrap:pretty\">Ready to get your time back?<\u002Fh2>\n    <p style=\"font-size:1.1875rem;line-height:1.6;color:rgba(27,22,16,0.66);margin:0 auto 36px;max-width:540px\">Book a 20-minute call and we'll show you what we'd take off your plate first.<\u002Fp>\n    <a href=\"#book-a-call\" style=\"background:#A8684F;color:#F7F2EC;font-size:16px;font-weight:500;border-radius:8px;padding:15px 28px;line-height:1;display:inline-flex;align-items:center;transition:background .22s\" style-hover=\"background:#8E5642;color:#F7F2EC\">Book a call<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"border-top:1px solid rgba(27,22,16,0.12);background:#F7F2EC\">\n  <div style=\"max-width:1160px;margin:0 auto;padding:56px clamp(22px,4vw,40px) 40px\">\n    <div style=\"display:flex;flex-wrap:wrap;gap:32px 48px;align-items:flex-start;justify-content:space-between\">\n      <div>\n        <span style=\"display:inline-flex;align-items:center;gap:10px\">\n          <img src=\"d451db59-bfd5-4ac2-aaf1-a47fe8234e71\" alt=\"\" style=\"height:33px;width:33px;object-fit:contain;margin-left:-3px\">\n          <span style=\"font-family:'Crimson Pro',Georgia,serif;font-size:22px;font-weight:600;letter-spacing:-0.01em;color:#1B1610\">Lantern Collabs<\u002Fspan>\n        <\u002Fspan>\n        <div style=\"margin-top:16px\"><span style=\"font-family:'Crimson Pro',Georgia,serif;font-style:italic;color:#A8684F;letter-spacing:.3em;font-size:14px\">Always&nbsp;On<\u002Fspan><\u002Fdiv>\n        <p style=\"font-size:14px;color:rgba(27,22,16,0.44);margin:12px 0 0\">Australian owned and managed<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:40px 64px\">\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(27,22,16,0.44)\">Services<\u002Fspan>\n          <a href=\"AI%20Agents.dc.html\" style=\"font-size:14.5px;color:rgba(27,22,16,0.66)\" style-hover=\"color:#A8684F\">AI agents<\u002Fa>\n          <a href=\"Dedicated%20Assistants.dc.html\" style=\"font-size:14.5px;color:rgba(27,22,16,0.66)\" style-hover=\"color:#A8684F\">Dedicated assistants<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:12px\">\n          <span style=\"font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:rgba(27,22,16,0.44)\">Company<\u002Fspan>\n          <a href=\"#book-a-call\" style=\"font-size:14.5px;color:rgba(27,22,16,0.66)\" style-hover=\"color:#A8684F\">Book a call<\u002Fa>\n          <a href=\"#\" style=\"font-size:14.5px;color:rgba(27,22,16,0.66)\" style-hover=\"color:#A8684F\">Contact<\u002Fa>\n          <a href=\"#\" style=\"font-size:14.5px;color:rgba(27,22,16,0.66)\" style-hover=\"color:#A8684F\">Privacy<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:40px;padding-top:22px;border-top:1px solid rgba(27,22,16,0.12)\">\n      <span style=\"font-size:13px;color:rgba(27,22,16,0.44)\">© 2026 Lantern Collabs. All rights reserved.<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  state = { open: 0 };\n  renderVals() {\n    const data = [\n      [\"What's the difference between an AI agent and a dedicated assistant?\",\n       \"An AI agent handles high-volume, repetitive work at any hour — answering calls, booking jobs, sending follow-ups. A dedicated assistant is a person working to your business, handling the work that needs judgement, context and a human voice. Most clients run both.\"],\n      [\"Can we start with one and add the other later?\",\n       \"Yes. Most businesses start wherever the pain is loudest and expand once it's working. Because it's all one partner, adding the second is a conversation, not a new procurement.\"],\n      [\"Do we have to change our systems?\",\n       \"No. Both plug into the tools you already use — your phone number, your calendar, your CRM. We do the setup end to end.\"],\n      [\"How much time does an assistant work?\",\n       \"Part-time at around 20 hours a week, full-time at 40, or premium skilled for specialised work like bookkeeping, marketing or CRM management. You subscribe monthly rather than employing directly.\"],\n      [\"Who manages the assistant day to day?\",\n       \"We do. Recruitment, screening, training, onboarding, performance monitoring and reporting sit with us — including replacing someone quickly if the fit isn't right. You direct the work; we manage the person.\"],\n      [\"How long until it's running?\",\n       \"After the first call we'll give you a clear timeline. AI agents are typically live in a couple of weeks; assistants are matched and onboarded shortly after.\"]\n    ];\n    return {\n      faqs: data.map(([question, answer], i) => ({\n        question, answer,\n        toggle: () => this.setState(s => ({ open: s.open === i ? -1 : i })),\n        signStyle: \"font-family:'Inter',sans-serif;font-size:22px;font-weight:400;color:#A8684F;line-height:1.2;flex-shrink:0;transition:transform .22s cubic-bezier(.22,.61,.36,1);transform:rotate(\" + (this.state.open === i ? 45 : 0) + \"deg)\",\n        answerStyle: \"display:\" + (this.state.open === i ? \"block\" : \"none\")\n      }))\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
